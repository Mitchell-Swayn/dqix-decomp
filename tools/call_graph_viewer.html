<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DQIX function call graph</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101722;color:#e3eaf4;font:14px system-ui}header{padding:16px 22px;border-bottom:1px solid #344155}h1{font-size:20px;margin:0 0 8px}button,input,select{font:inherit;background:#202d40;color:inherit;border:1px solid #52637b;border-radius:5px;padding:8px}button{cursor:pointer}button:hover{background:#354967}main{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 113px)}aside{padding:16px;overflow:auto;border-right:1px solid #344155}input,select{width:100%;margin-bottom:8px}.row{display:flex;gap:8px;margin-bottom:8px}.row>*{flex:1}.result{display:block;width:100%;text-align:left;margin:5px 0;overflow-wrap:anywhere}.meta{font-size:12px;color:#b1bfd1}#stage{position:relative;overflow:hidden}canvas{width:100%;height:100%;touch-action:none}#status{position:absolute;bottom:12px;left:12px;background:#101722dd;padding:8px;max-width:90%;pointer-events:none}#detail{overflow-wrap:anywhere}h2{font-size:16px}summary{cursor:pointer}li{margin-bottom:8px}#neighbors button{padding:5px;font-size:12px}.legend{color:#b1bfd1}a{color:#8bc7ff}@media(max-width:700px){main{grid-template-columns:240px 1fr}header{padding:10px}aside{padding:10px}}
</style>
<header><h1>Dragon Quest IX · directed function call graph</h1><div id="counts"></div><div class="legend">Arrow: caller → callee · blue: callers · amber: selected · green: callees · dashed: ambiguous overlay target</div></header>
<main><aside><label for="search">Find a function or address</label><input id="search" placeholder="InitRandom, ARM7_, 02074208…"><label for="module">Module</label><select id="module"><option value="">All modules</option></select><div class="row"><button id="overview">Overview</button><button id="fit">Fit view</button></div><label for="depth">Neighborhood depth</label><select id="depth"><option value="1">1 hop</option><option value="2">2 hops</option><option value="3">3 hops</option></select><div id="results"></div><div id="detail"></div><div id="neighbors"></div><details><summary>Coverage and uncertainty</summary><ul id="limitations"></ul><p>Unknown indirect targets are listed on each function. No edge does not necessarily mean no runtime calls.</p></details><button id="export">Export graph JSON</button></aside><section id="stage"><canvas id="network" aria-label="Directed call graph"></canvas><div id="status"></div></section></main>
<script>
const graph=/*GRAPH_DATA*/;
const $=id=>document.getElementById(id), nodes=new Map(graph.nodes.map(n=>[n.id,n])), outgoing=new Map(), incoming=new Map(), unknown=new Map();
for(const e of graph.edges){if(!outgoing.has(e.source))outgoing.set(e.source,[]);outgoing.get(e.source).push(e);if(!incoming.has(e.target))incoming.set(e.target,[]);incoming.get(e.target).push(e)}
for(const s of graph.indirect){if(!unknown.has(s.source))unknown.set(s.source,[]);unknown.get(s.source).push(s)}
const hex=x=>'0x'+x.toString(16).padStart(8,'0');
function label(n){return n.name.replace(/^_Z\d+/, '').replace(/P6Random.*$/,'')}
for(const m of Object.keys(graph.metadata.module_counts).sort()){const o=document.createElement('option');o.value=m;o.textContent=m+' ('+graph.metadata.module_counts[m]+')';$('module').append(o)}
$('counts').textContent=graph.nodes.length.toLocaleString()+' inventoried functions · '+graph.edges.length.toLocaleString()+' directed connections · '+graph.indirect.length.toLocaleString()+' unresolved indirect sites';
for(const text of graph.metadata.limitations){const li=document.createElement('li');li.textContent=text;$('limitations').append(li)}
let selected=null, shown=[], lines=[], positions=new Map(), zoom=1, pan={x:0,y:0}, width=1,height=1, overview=false;
const canvas=$('network'), ctx=canvas.getContext('2d');
function allowed(n,ignoreLayer=false){return (!$('module').value||n.module===$('module').value)&&(ignoreLayer||!$('layer')?.value||n.lineage?.layer===+$('layer').value)}
function results(){const q=$('search').value.toLowerCase();const hits=graph.nodes.filter(n=>allowed(n)&&(!q||(n.name+' '+hex(n.address)+' '+label(n)).toLowerCase().includes(q)));$('results').replaceChildren();for(const n of hits.slice(0,30)){const b=document.createElement('button');b.className='result';b.textContent=label(n)+' · '+n.module+' · '+hex(n.address);b.onclick=()=>select(n.id);$('results').append(b)}if(hits.length>30){const p=document.createElement('p');p.className='meta';p.textContent=hits.length+' matches; refine search to see more.';$('results').append(p)}}
function select(id){selected=id;overview=false;const n=nodes.get(id);$('detail').replaceChildren();const title=document.createElement('h2');title.textContent=label(n);$('detail').append(title);const p=document.createElement('p');p.className='meta';p.textContent=n.name+'\n'+n.module+' · '+hex(n.address)+' · '+n.size+' bytes · '+n.mode;$('detail').append(p);$('neighbors').replaceChildren();for(const [name,es] of [['Callers',incoming.get(id)||[]],['Callees',outgoing.get(id)||[]]]){const h=document.createElement('h2');h.textContent=name+' ('+es.length+')';$('neighbors').append(h);for(const e of es){const b=document.createElement('button');b.className='result';const other=nodes.get(name==='Callers'?e.source:e.target);b.textContent=label(other)+' · '+other.module+' · '+e.kind+(e.ambiguous?' · ambiguous':'');b.title='Sites: '+e.sites.map(hex).join(', ');b.onclick=()=>select(other.id);$('neighbors').append(b)}}for(const site of unknown.get(id)||[]){const p=document.createElement('p');p.className='meta';p.textContent='Unresolved: '+hex(site.site)+' '+site.instruction;$('neighbors').append(p)}for(const site of graph.unresolved.filter(s=>s.module===n.module&&s.site>=n.address&&s.site<n.address+n.size)){const p=document.createElement('p');p.className='meta';p.textContent=site.reason+': '+hex(site.site)+' → '+hex(site.target);$('neighbors').append(p)}neighborhood()}
function neighborhood(){const ids=new Set([selected]);let front=[selected];const hops=+$('depth').value;for(let i=0;i<hops;i++){const next=[];for(const id of front)for(const e of [...outgoing.get(id)||[],...incoming.get(id)||[]])for(const dst of [e.source,e.target])if(!ids.has(dst)&&allowed(nodes.get(dst),true)){ids.add(dst);next.push(dst)}front=next}shown=[...ids];lines=graph.edges.filter(e=>ids.has(e.source)&&ids.has(e.target));positions.clear();positions.set(selected,{x:0,y:0});const callers=new Set((incoming.get(selected)||[]).map(e=>e.source));const callees=new Set((outgoing.get(selected)||[]).map(e=>e.target));const groups=[shown.filter(id=>id!==selected&&callers.has(id)),shown.filter(id=>id!==selected&&!callers.has(id)&&callees.has(id)),shown.filter(id=>id!==selected&&!callers.has(id)&&!callees.has(id))];groups.forEach((group,g)=>group.forEach((id,i)=>{const angle=2*Math.PI*i/Math.max(1,group.length);if(g<2)positions.set(id,{x:g===0?-330:330,y:(i-(group.length-1)/2)*48});else positions.set(id,{x:650*Math.cos(angle),y:650*Math.sin(angle)})}));fit();$('status').textContent=shown.length+' functions · '+lines.length+' edges · click a node to explore · drag to pan · scroll to zoom'}
function whole(){overview=true;selected=null;shown=graph.nodes.filter(allowed).map(n=>n.id);const ids=new Set(shown);lines=graph.edges.filter(e=>ids.has(e.source)&&ids.has(e.target));positions.clear();const mods=[...new Set(shown.map(id=>nodes.get(id).module))];mods.forEach((m,k)=>{const a=k*2*Math.PI/mods.length,cx=mods.length===1?0:900*Math.cos(a),cy=mods.length===1?0:900*Math.sin(a);const group=shown.filter(id=>nodes.get(id).module===m);group.forEach((id,i)=>{const theta=i*2.399963,r=6*Math.sqrt(i);positions.set(id,{x:cx+r*Math.cos(theta),y:cy+r*Math.sin(theta)})})});$('detail').textContent='Overview groups functions by module. Search or click a node to inspect its directed neighborhood.';$('neighbors').replaceChildren();fit();$('status').textContent=shown.length+' functions · '+lines.length+' edges · zoom in and click a node'}
function fit(){if(!positions.size)return;let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;for(const p of positions.values()){minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y)}zoom=Math.min(1.3,(width-160)/Math.max(200,maxX-minX),(height-100)/Math.max(200,maxY-minY));pan={x:width/2-(minX+maxX)*zoom/2,y:height/2-(minY+maxY)*zoom/2};draw()}
function screen(id){const p=positions.get(id);return {x:p.x*zoom+pan.x,y:p.y*zoom+pan.y}}
function draw(){ctx.clearRect(0,0,width,height);const radius=overview?Math.max(1.3,3*zoom):7;ctx.lineWidth=overview?.4:1;for(const e of lines){const a=screen(e.source),b=screen(e.target);ctx.strokeStyle=e.ambiguous?'#b990d2':e.source===selected?'#66caaa':e.target===selected?'#71adf2':'#536277';ctx.globalAlpha=overview?.13:.65;ctx.setLineDash(e.ambiguous?[4,4]:[]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();if(!overview||zoom>.7){const angle=Math.atan2(b.y-a.y,b.x-a.x),x=b.x-(radius+3)*Math.cos(angle),y=b.y-(radius+3)*Math.sin(angle);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-8*Math.cos(angle-.45),y-8*Math.sin(angle-.45));ctx.moveTo(x,y);ctx.lineTo(x-8*Math.cos(angle+.45),y-8*Math.sin(angle+.45));ctx.stroke()}}ctx.setLineDash([]);ctx.globalAlpha=1;for(const id of shown){const p=screen(id);if(p.x< -200||p.x>width+200||p.y< -20||p.y>height+20)continue;ctx.fillStyle=id===selected?'#ffc46b':(incoming.get(selected)||[]).some(e=>e.source===id)?'#71adf2':'#66caaa';ctx.beginPath();ctx.arc(p.x,p.y,radius,0,Math.PI*2);ctx.fill();if(!overview&&(shown.length<130||zoom>.7)||overview&&zoom>2){ctx.fillStyle='#e3eaf4';ctx.font='12px system-ui';ctx.fillText(label(nodes.get(id)),p.x+radius+5,p.y+4)}}}
new ResizeObserver(()=>{const r=$('stage').getBoundingClientRect();width=r.width;height=r.height;canvas.width=width*devicePixelRatio;canvas.height=height*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);fit()}).observe($('stage'));
let drag=null;canvas.onpointerdown=e=>{drag={x:e.offsetX,y:e.offsetY,px:pan.x,py:pan.y,moved:false};canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(drag){if(Math.hypot(e.offsetX-drag.x,e.offsetY-drag.y)>4)drag.moved=true;pan.x=drag.px+e.offsetX-drag.x;pan.y=drag.py+e.offsetY-drag.y;draw()}else{let best=12,hit=null;for(const id of shown){const p=screen(id),d=Math.hypot(p.x-e.offsetX,p.y-e.offsetY);if(d<best){best=d;hit=id}}canvas.title=hit?nodes.get(hit).name+' · '+nodes.get(hit).module+' · '+hex(nodes.get(hit).address):''}};canvas.onpointerup=e=>{if(drag&&!drag.moved){let best=14,hit=null;for(const id of shown){const p=screen(id),d=Math.hypot(p.x-e.offsetX,p.y-e.offsetY);if(d<best){best=d;hit=id}}if(hit)select(hit)}drag=null};canvas.onwheel=e=>{e.preventDefault();const next=Math.max(.015,Math.min(20,zoom*Math.exp(-e.deltaY*.001)));pan.x=e.offsetX-(e.offsetX-pan.x)*next/zoom;pan.y=e.offsetY-(e.offsetY-pan.y)*next/zoom;zoom=next;draw()};
$('search').oninput=results;$('module').onchange=()=>{results();if(overview)whole();else neighborhood()};$('depth').onchange=()=>{if(selected)neighborhood()};$('overview').onclick=whole;$('fit').onclick=fit;$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(graph)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='dqix-call-graph.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('results').before($('detail'),$('neighbors'));
const databaseDownload=document.createElement('a');databaseDownload.href='functions.sqlite';databaseDownload.download='dqix-functions.sqlite';databaseDownload.textContent='Download SQLite database';databaseDownload.style.display='block';$('export').after(databaseDownload);
if(graph.metadata.lineage){
  const layerLabel=document.createElement('label');layerLabel.htmlFor='layer';layerLabel.textContent='Dependency layer';
  const layerSelect=document.createElement('select');layerSelect.id='layer';const all=document.createElement('option');all.value='';all.textContent='All layers · lowest first';layerSelect.append(all);
  const summary=graph.metadata.lineage.summary;
  for(const [layer,count] of Object.entries(summary.functions_by_layer)){const option=document.createElement('option');option.value=layer;option.textContent='Layer '+layer+' ('+count+' functions)';layerSelect.append(option)}
  $('module').after(layerLabel,layerSelect);layerSelect.onchange=()=>{results();if(overview)whole();else if(selected)neighborhood()};
  graph.nodes.sort((a,b)=>a.lineage.layer-b.lineage.layer||a.lineage.group.localeCompare(b.lineage.group)||a.id.localeCompare(b.id));
  const originalSelect=select;select=function(id){originalSelect(id);const n=nodes.get(id),l=n.lineage;const p=document.createElement('p');p.textContent='Dependency layer '+l.layer+(l.recursive?' · recursive group of '+l.group_size+' functions':'')+(l.unresolved_downstream?' · unresolved dependencies downstream':'')+(l.ambiguous_downstream?' · includes possible overlay targets':'');$('detail').append(p);
    if(l.recursive){const label=document.createElement('label');label.textContent='Functions to analyze together';const members=document.createElement('select');for(const member of graph.nodes.filter(x=>x.lineage.group===l.group)){const option=document.createElement('option');option.value=member.id;option.textContent=member.name+' · '+member.module;option.selected=member.id===id;members.append(option)}members.onchange=()=>select(members.value);$('detail').append(label,members)}
  };
  const help=document.createElement('p');help.textContent=graph.metadata.lineage.definition+' '+graph.metadata.lineage.caveat;$('limitations').append(help);
  const order=document.createElement('button');order.textContent='Download decompilation order (CSV)';order.onclick=()=>{const rows=[['layer','module','function','address','group','group_size','recursive','unresolved_downstream','ambiguous_downstream']];for(const n of graph.nodes){const l=n.lineage;rows.push([l.layer,n.module,n.name,hex(n.address),l.group,l.group_size,l.recursive,l.unresolved_downstream,l.ambiguous_downstream])}const csv=rows.map(row=>row.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='dqix-decompilation-order.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('export').after(order);
}
results();select(graph.nodes.find(n=>n.name.includes('InitRandom')).id);
</script></html>
