<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font-family:var(--font-sans,system-ui);color:var(--foreground,#18212c);margin:0}h2{font-size:20px;margin:0 0 8px}p{color:var(--muted-foreground,#596473);font-size:14px;margin:0 0 14px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}input,select,button,a.download{font:inherit;border:1px solid var(--border,#cbd1da);border-radius:8px;padding:9px 12px;background:var(--card,#fff);color:inherit}input{flex:1;min-width:150px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}.sprite{padding:16px 8px;border-radius:10px;background:var(--secondary,#e7eaf0);border:1px solid var(--border,#d4d9e1);cursor:pointer;text-align:center}.sprite img{display:block;width:72px;height:72px;margin:auto;image-rendering:pixelated}.sprite span{display:block;margin-top:8px;font:12px var(--font-mono,monospace)}.pages{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0}button:disabled{opacity:.4;cursor:default}dialog{border:1px solid var(--border,#ccd);background:var(--card,#fff);color:var(--foreground,#18212c);border-radius:16px;padding:24px;text-align:center}dialog img{display:block;width:192px;height:192px;image-rendering:pixelated;margin:16px auto;background:repeating-conic-gradient(#ccd0d8 0% 25%,#eff1f5 0% 50%) 0/24px 24px}dialog::backdrop{background:#0008}a.download{display:inline-block;text-decoration:none;margin:8px}#status{font-size:13px;color:var(--muted-foreground,#596473)}
</style></head><body><h2>DQIX item sprites</h2><p>1,021 transparent PNGs · 24 × 24 pixels · select an image to enlarge or download</p><div class="controls"><input id="search" aria-label="Search sprites" placeholder="Filter filename, e.g. d_w152"><select id="category" aria-label="Category code"><option value="">All category codes</option></select></div><div class="grid" id="grid"></div><div class="pages"><button id="prev">Previous</button><span id="status"></span><button id="next">Next</button></div><dialog id="detail"><h2 id="name"></h2><img id="large" alt="Selected item sprite"><a class="download" id="download">Download PNG</a><button id="close">Close</button></dialog><script>
const items=__ITEMS__, size=24;let page=0;
const $=id=>document.getElementById(id),cats=[...new Set(items.map(i=>i.name[2]))].sort();
for(const code of cats){const o=document.createElement('option');o.value=code;o.textContent=code;$('category').append(o)}
function draw(){const query=$('search').value.trim().toLowerCase(),cat=$('category').value;const filtered=items.filter(i=>i.name.includes(query)&&(!cat||i.name[2]===cat));const pages=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(page,pages-1);$('grid').replaceChildren();for(const item of filtered.slice(page*size,(page+1)*size)){const b=document.createElement('button');b.className='sprite';b.title=item.name;const im=document.createElement('img');im.src=item.src;im.alt=item.name;const label=document.createElement('span');label.textContent=item.name;b.append(im,label);b.onclick=()=>{$('name').textContent=item.name;$('large').src=item.src;$('download').href=item.src;$('download').download=item.name+'.png';$('detail').showModal()};$('grid').append(b)}$('status').textContent=`${filtered.length} sprites · page ${page+1} / ${pages}`;$('prev').disabled=page===0;$('next').disabled=page===pages-1}
$('search').oninput=$('category').onchange=()=>{page=0;draw()};$('prev').onclick=()=>{page--;draw()};$('next').onclick=()=>{page++;draw()};$('close').onclick=()=>$('detail').close();draw();console.log('Gallery records:',items.length,'Visible cards:',document.querySelectorAll('.sprite').length);
</script></body></html>
